<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تَذَكَّر</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --forest-green: #073B2F;
            --burgundy: #5E202B;
            --pale-sage: #F0FFDA;
            --petal-blush: #FAC7FF;

            --bg-color: var(--pale-sage);
            --text-main: var(--forest-green);
            --text-muted: rgba(7, 59, 47, 0.7);
            --header-bg: rgba(240, 255, 218, 0.9);
            --card-glass: rgba(255, 255, 255, 0.6);
            --border-color: rgba(7, 59, 47, 0.15);
            --primary: var(--burgundy);
            --nav-bg: rgba(255, 255, 255, 0.9);
        }

        [data-theme="dark"] {
            --bg-color: var(--forest-green);
            --text-main: var(--pale-sage);
            --text-muted: rgba(240, 255, 218, 0.6);
            --header-bg: rgba(7, 59, 47, 0.9);
            --card-glass: rgba(0, 0, 0, 0.2);
            --border-color: rgba(240, 255, 218, 0.1);
            --primary: var(--petal-blush);
            --nav-bg: rgba(7, 59, 47, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }

        /* --- الشاشة الافتتاحية --- */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: var(--forest-green);
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }
        #splash h1 { font-size: 4rem; color: var(--pale-sage); font-weight: 900; animation: pulse 1.5s infinite alternate; }
        .quran-verse { font-family: 'Amiri', serif; color: var(--petal-blush); font-size: 1.1rem; position: absolute; bottom: 40px; opacity: 0.9; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }

        /* --- الشريط العلوي --- */
        header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;
            background: var(--header-bg); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); z-index: 10;
        }
        .icon-btn { background: none; border: none; color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        header h1 { font-size: 1.8rem; font-weight: 900; color: var(--primary); margin: 0; }
        .spacer { width: 24px; }

        /* --- منطقة المحتوى --- */
        main { flex: 1; overflow-y: auto; padding: 20px 15px; padding-bottom: 90px; }
        .posts-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr);
            gap: 15px; 
            max-width: 800px; margin: 0 auto;
        }

        /* --- بطاقة السُنة --- */
        .post-card {
            background: var(--card-glass); border: 1px solid var(--border-color); border-radius: 16px;
            padding: 15px; display: flex; flex-direction: column; position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); color: var(--forest-green); 
        }
        .card-text { font-family: 'Amiri', serif; font-size: 1.1rem; line-height: 1.6; flex: 1; margin-bottom: 12px; word-break: break-word; }
        .card-signature { font-size: 0.85rem; font-weight: 700; text-align: left; margin-bottom: 12px; opacity: 0.8; }
        .card-actions { display: flex; justify-content: space-between; border-top: 1px solid var(--border-color); padding-top: 12px; }
        .action-btn { background: none; border: none; font-size: 0.9rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; color: inherit; opacity: 0.8; }
        .action-btn:hover { opacity: 1; }
        .action-btn svg { width: 18px; height: 18px; }

        /* --- الشريط السفلي --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--nav-bg); backdrop-filter: blur(15px); border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center; padding: 10px 20px; padding-bottom: max(10px, env(safe-area-inset-bottom));
            z-index: 20;
        }
        .nav-item { background: none; border: none; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; transition: 0.3s; }
        .nav-item svg { width: 24px; height: 24px; stroke-width: 2; }
        .nav-item.active { color: var(--primary); }
        .nav-fab { width: 55px; height: 55px; border-radius: 50%; background: var(--primary); color: var(--bg-color); border: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(7, 59, 47, 0.2); cursor: pointer; transform: translateY(-8px); }
        .nav-fab svg { width: 28px; height: 28px; stroke-width: 2.5; }

        /* --- النوافذ المنبثقة --- */
        .modal-overlay { position: fixed; inset: 0; background: rgba(7, 59, 47, 0.6); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--bg-color); width: 100%; max-width: 500px; border-radius: 20px; padding: 25px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        
        .close-modal { position: absolute; top: 15px; left: 15px; background: none; border: none; color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .close-modal svg { width: 24px; height: 24px; }
        
        .modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; color: var(--primary); text-align: center; }
        .form-input { width: 100%; background: var(--card-glass); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 12px; margin-bottom: 12px; font-size: 1rem; outline: none; }
        textarea.form-input { font-family: 'Amiri', serif; font-size: 1.2rem; resize: none; }
        
        .options-row { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 5px; }
        .color-dot { min-width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-dot.active { border-color: var(--primary); transform: scale(1.1); box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        
        .submit-btn { width: 100%; background: var(--primary); color: var(--pale-sage); border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { opacity: 0.9; }

        @media (min-width: 768px) { .posts-grid { grid-template-columns: repeat(3, 1fr); } }
    </style>
</head>
<body data-theme="light">

    <div id="splash">
        <h1>تَذَكَّر</h1>
        <p class="quran-verse">(فَذَكِّرْ إِنَّ الذِّكْرَى تَنفَعُ الْمُؤْمِنِينَ)</p>
    </div>

    <header>
        <button class="icon-btn" onclick="toggleTheme()" aria-label="تبديل النمط">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
            </svg>
        </button>
        <h1>تَذَكَّر</h1>
        <div class="spacer"></div>
    </header>

    <main><div id="postsContainer" class="posts-grid"></div></main>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchView('home')" aria-label="الرئيسية">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </button>
        <button class="nav-fab" onclick="openModal('addModal')" aria-label="إضافة">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="nav-item" onclick="switchView('leaderboard')" aria-label="المتصدرين">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        </button>
    </nav>

    <div class="modal-overlay" id="addModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('addModal')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <h2 class="modal-title">أضف سُنة مهجورة</h2>
            <form id="postForm">
                <input type="text" id="authorInput" class="form-input" placeholder="الاسم أو اللقب" required>
                <textarea id="textInput" class="form-input" rows="4" placeholder="اكتب السُنة هنا..." required></textarea>
                
                <label style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px; display: block;">لون المنشور:</label>
                <div class="options-row" id="colorPicker">
                    <div class="color-dot active" style="background: #F0FFDA;" data-color="#F0FFDA"></div>
                    <div class="color-dot" style="background: #FAC7FF;" data-color="#FAC7FF"></div>
                    <div class="color-dot" style="background: #FFFFFF;" data-color="#FFFFFF"></div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">نشر السُنة</button>
            </form>
        </div>
    </div>

    <!-- استدعاء Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSLuKFb3DDzXhzLRhkDvK24UKJSxGy4kY",
            authDomain: "tathakkar.firebaseapp.com",
            projectId: "tathakkar",
            storageBucket: "tathakkar.firebasestorage.app",
            messagingSenderId: "519113054003",
            appId: "1:519113054003:web:331ce2e58585e985ed9046"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let selectedColor = '#F0FFDA';
        let allPosts = [];
        let currentView = 'home';

        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 500);
            }, 3000); 
        });

        window.openModal = (id) => document.getElementById(id).classList.add('active');
        window.closeModal = (id) => document.getElementById(id).classList.remove('active');
        
        window.switchView = (view) => {
            currentView = view;
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            if(view === 'home') renderPosts(allPosts);
            if(view === 'leaderboard') renderLeaderboard(allPosts);
        };

        window.toggleTheme = () => {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        };

        document.querySelectorAll('.color-dot').forEach(dot => {
            dot.addEventListener('click', function() {
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                this.classList.add('active');
                selectedColor = this.getAttribute('data-color');
            });
        });

        // الاستماع المباشر لقاعدة البيانات (يُحدّث الشاشة فوراً عند كل إضافة)
        const q = query(collection(db, "sunnahs"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            allPosts = [];
            snapshot.forEach((doc) => {
                allPosts.push({ id: doc.id, ...doc.data() });
            });
            
            if(currentView === 'home') renderPosts(allPosts);
            else renderLeaderboard(allPosts);
        }, (error) => {
            console.error("خطأ في قراءة البيانات: ", error);
            document.getElementById('postsContainer').innerHTML = '<p style="text-align:center; margin-top:50px; color:var(--text-muted); grid-column:1/-1;">لم يتم تفعيل قاعدة البيانات بعد (Firestore). تأكدي من إنشائها من لوحة تحكم Firebase.</p>';
        });

        // إضافة سُنة
        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "جاري النشر..."; btn.disabled = true;

            const author = document.getElementById('authorInput').value;
            const text = document.getElementById('textInput').value;

            try {
                await addDoc(collection(db, "sunnahs"), {
                    author: author,
                    text: text,
                    color: selectedColor,
                    likes: 0,
                    timestamp: Date.now()
                });
                closeModal('addModal');
                document.getElementById('postForm').reset();
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("تأكدي من تفعيل Firestore Database في وضع Test Mode من حسابك.");
            }
            btn.innerText = "نشر السُنة"; btn.disabled = false;
        });

        // الإعجاب بالسُنة
        window.likePost = async (id) => {
            const postRef = doc(db, "sunnahs", id);
            await updateDoc(postRef, {
                likes: increment(1)
            });
        };

        window.sharePost = (text, author) => {
            if (navigator.share) navigator.share({ title: 'سُنة مهجورة', text: `${text} \n- بواسطة: ${author} \nشاركونا الأجر عبر موقع تَذَكَّر`});
            else alert('تم نسخ النص للمشاركة!');
        };

        function renderPosts(posts) {
            const container = document.getElementById('postsContainer');
            container.innerHTML = posts.length === 0 ? '<p style="text-align:center; margin-top:50px; color:var(--text-muted); grid-column:1/-1;">لا توجد مشاركات بعد.. كوني أول من ينشر سُنة!</p>' : '';
            
            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.style.background = post.color;
                card.innerHTML = `
                    <div class="card-text">${post.text}</div>
                    <div class="card-signature">بواسطة: ${post.author}</div>
                    <div class="card-actions">
                        <button class="action-btn" onclick="likePost('${post.id}')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                            ${post.likes}
                        </button>
                        <button class="action-btn" onclick="sharePost('${post.text}', '${post.author}')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                            مشاركة
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderLeaderboard(posts) {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '<h2 style="grid-column:1/-1; text-align:center; margin-bottom:20px; color:var(--primary);">المتصدرين</h2>';
            const sorted = [...posts].sort((a, b) => b.likes - a.likes).slice(0, 10);
            
            sorted.forEach((post, index) => {
                const div = document.createElement('div');
                div.style = 'grid-column:1/-1; background:var(--card-glass); padding:15px; border-radius:12px; margin-bottom:10px; display:flex; justify-content:space-between; border:1px solid var(--border-color);';
                div.innerHTML = `<div><strong>المركز ${index+1} - ${post.author}</strong> <span style="font-size:0.85rem; color:var(--text-muted); display:block; margin-top:5px;">${post.text.substring(0,40)}...</span></div> <div style="color:var(--primary); font-weight:bold; display:flex; align-items:center; gap:5px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> ${post.likes}</div>`;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
