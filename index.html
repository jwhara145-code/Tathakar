<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تَذَكَّر | المبادرة المدرسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <!-- مكتبة حفظ الصور -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --forest-green: #073B2F;
            --burgundy: #5E202B;
            --pale-sage: #F0FFDA;
            --petal-blush: #FAC7FF;

            --bg-color: #e9f2e3;
            --text-main: var(--forest-green);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 8px 32px 0 rgba(7, 59, 47, 0.1);
        }

        [data-theme="dark"] {
            --bg-color: #04241d;
            --text-main: var(--pale-sage);
            --glass-border: rgba(240, 255, 218, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* متغيرات ألوان البطاقات (تتكيف مع النمط الليلي) */
        .theme-sage { --card-bg: rgba(240, 255, 218, 0.6); --card-text-color: var(--forest-green); }
        .theme-blush { --card-bg: rgba(250, 199, 255, 0.5); --card-text-color: var(--forest-green); }
        .theme-glass { --card-bg: rgba(255, 255, 255, 0.6); --card-text-color: var(--forest-green); }

        [data-theme="dark"] .theme-sage { --card-bg: rgba(240, 255, 218, 0.15); --card-text-color: var(--pale-sage); }
        [data-theme="dark"] .theme-blush { --card-bg: rgba(250, 199, 255, 0.15); --card-text-color: var(--petal-blush); }
        [data-theme="dark"] .theme-glass { --card-bg: rgba(255, 255, 255, 0.1); --card-text-color: #ffffff; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; transition: background-color 0.3s, color 0.3s; }
        
        body { 
            background-color: var(--bg-color); color: var(--text-main); 
            height: 100vh; display: flex; flex-direction: column; 
            overflow: hidden; position: relative; 
        }

        /* --- خلفية متحركة تفاعلية --- */
        .animated-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; }
        .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.6; animation: float 20s infinite ease-in-out alternate; }
        .orb-1 { width: 300px; height: 300px; background: var(--petal-blush); top: -50px; left: -50px; }
        .orb-2 { width: 400px; height: 400px; background: var(--pale-sage); bottom: -100px; right: -50px; animation-delay: -5s; }
        .orb-3 { width: 250px; height: 250px; background: var(--burgundy); top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.2; animation-duration: 25s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 50px) scale(1.1); }
            100% { transform: translate(-40px, 20px) scale(0.9); }
        }

        .glass-panel {
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
        }

        header {
            background: rgba(255,255,255,0.2);
            display: flex; justify-content: space-between; align-items: center; padding: 15px 25px;
            z-index: 10; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; margin-bottom: 10px;
        }
        [data-theme="dark"] header { background: rgba(0,0,0,0.2); }
        
        .icon-btn { background: none; border: none; color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0.8;}
        header h1 { font-size: 1.8rem; font-weight: 900; color: var(--burgundy); margin: 0; letter-spacing: -0.5px; }
        [data-theme="dark"] header h1 { color: var(--petal-blush); }

        main { flex: 1; overflow-y: auto; padding: 10px 20px 100px 20px; }
        .posts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        
        /* --- تصميم البطاقة --- */
        .post-card {
            border-radius: 24px; padding: 25px; display: flex; flex-direction: column; position: relative;
            background: var(--card-bg); color: var(--card-text-color);
            transform: translateY(0); transition: transform 0.3s, box-shadow 0.3s;
        }
        .post-card:hover { transform: translateY(-3px); box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.15); }
        
        .card-text { font-family: 'Amiri', serif; font-size: 1.3rem; line-height: 1.8; flex: 1; margin-bottom: 20px; word-break: break-word; font-weight: 700; }
        .card-signature { font-size: 0.9rem; font-weight: 900; margin-bottom: 15px; opacity: 0.9; display: flex; align-items: center; gap: 8px; }
        .card-actions { display: flex; justify-content: space-between; border-top: 1px solid currentColor; padding-top: 15px; align-items: center; opacity: 0.8; }
        
        .action-btn { background: none; border: none; font-size: 0.95rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; color: currentColor; opacity: 0.7; }
        .action-btn:hover { opacity: 1; transform: scale(1.05); }
        .action-btn.liked { opacity: 1; color: var(--burgundy); }
        [data-theme="dark"] .action-btn.liked { color: var(--petal-blush); }
        
        .action-btn svg { width: 20px; height: 20px; }
        .delete-btn { color: #e74c3c !important; opacity: 0.8; }

        .bottom-nav {
            background: rgba(255,255,255,0.3);
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px;
            border-radius: 30px; display: flex; justify-content: space-around; align-items: center; padding: 10px 20px; z-index: 20;
        }
        [data-theme="dark"] .bottom-nav { background: rgba(0,0,0,0.3); }
        .nav-item { background: none; border: none; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; color: var(--text-main); opacity: 0.5; cursor: pointer; }
        .nav-item.active { opacity: 1; color: var(--burgundy); }
        [data-theme="dark"] .nav-item.active { color: var(--petal-blush); }
        .nav-fab { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, var(--burgundy), var(--forest-green)); color: var(--pale-sage); border: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(94, 32, 43, 0.4); cursor: pointer; transform: translateY(-15px); border: 3px solid var(--glass-border); }

        /* --- النوافذ المنبثقة --- */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--bg-color); width: 100%; max-width: 450px; border-radius: 24px; padding: 30px; position: relative; }
        
        .close-modal { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.05); border-radius: 50%; width: 35px; height: 35px; border: none; color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .modal-title { font-size: 1.3rem; font-weight: 900; margin-bottom: 25px; color: var(--burgundy); text-align: center; }
        [data-theme="dark"] .modal-title { color: var(--petal-blush); }

        .form-input { width: 100%; background: rgba(255,255,255,0.4); border: 1px solid rgba(0,0,0,0.1); color: var(--text-main); padding: 15px; border-radius: 16px; margin-bottom: 15px; font-size: 1rem; outline: none; }
        textarea.form-input { font-family: 'Amiri', serif; font-size: 1.2rem; resize: none; }
        
        .options-row { display: flex; gap: 12px; overflow-x: auto; margin-bottom: 25px; justify-content: center; }
        .color-dot { min-width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(0,0,0,0.1); transition: 0.3s; }
        .color-dot.active { transform: scale(1.2); border-color: var(--forest-green); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        
        .submit-btn { width: 100%; background: var(--burgundy); color: var(--pale-sage); border: none; padding: 15px; border-radius: 16px; font-weight: 900; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
    </style>
</head>
<body data-theme="light">

    <!-- الخلفية الحركية -->
    <div class="animated-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <header class="glass-panel">
        <button class="icon-btn" onclick="toggleTheme()" aria-label="تغيير النمط">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        </button>
        <h1>تَذَكَّر</h1>
        <div style="width: 24px;"></div>
    </header>

    <main><div id="postsContainer" class="posts-grid"></div></main>

    <nav class="bottom-nav glass-panel">
        <button class="nav-item active" onclick="switchView('home')">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </button>
        <button class="nav-fab" onclick="openModal('addModal')">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="nav-item" onclick="switchView('leaderboard')">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        </button>
    </nav>

    <div class="modal-overlay" id="addModal">
        <div class="modal-content glass-panel">
            <button class="close-modal" onclick="closeModal('addModal')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <h2 class="modal-title">أضف سُنة مهجورة</h2>
            <form id="postForm">
                <input type="text" id="authorInput" class="form-input" placeholder="الاسم أو اللقب" required>
                <textarea id="textInput" class="form-input" rows="4" placeholder="اكتب السُنة هنا..." required></textarea>
                
                <div class="options-row" id="colorPicker">
                    <!-- تم تغيير الألوان إلى أسماء Themes لتتوافق مع الوضع الليلي -->
                    <div class="color-dot active" style="background: rgba(240, 255, 218, 0.8);" data-theme="theme-sage"></div>
                    <div class="color-dot" style="background: rgba(250, 199, 255, 0.8);" data-theme="theme-blush"></div>
                    <div class="color-dot" style="background: #ffffff;" data-theme="theme-glass"></div>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">نشر السُنة</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, arrayUnion, arrayRemove, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSLuKFb3DDzXhzLRhkDvK24UKJSxGy4kY",
            authDomain: "tathakkar.firebaseapp.com",
            projectId: "tathakkar",
            storageBucket: "tathakkar.firebasestorage.app",
            messagingSenderId: "519113054003",
            appId: "1:519113054003:web:331ce2e58585e985ed9046"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // بصمة الجهاز
        let deviceId = localStorage.getItem('tathakkar_device');
        if (!deviceId) {
            deviceId = 'dev_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('tathakkar_device', deviceId);
        }

        let selectedTheme = 'theme-sage';
        window.allPosts = [];
        let currentView = 'home';

        window.openModal = (id) => document.getElementById(id).classList.add('active');
        window.closeModal = (id) => document.getElementById(id).classList.remove('active');
        
        window.switchView = (view) => {
            currentView = view;
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            if(view === 'home') renderPosts(window.allPosts);
            if(view === 'leaderboard') renderLeaderboard(window.allPosts);
        };

        window.toggleTheme = () => {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        };

        document.querySelectorAll('.color-dot').forEach(dot => {
            dot.addEventListener('click', function() {
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                this.classList.add('active');
                selectedTheme = this.getAttribute('data-theme');
            });
        });

        // قراءة البيانات
        const q = query(collection(db, "sunnahs"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            window.allPosts = [];
            snapshot.forEach((doc) => {
                window.allPosts.push({ id: doc.id, ...doc.data() });
            });
            if(currentView === 'home') renderPosts(window.allPosts);
            else renderLeaderboard(window.allPosts);
        });

        // إضافة منشور جديد
        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "جاري النشر..."; btn.disabled = true;

            try {
                await addDoc(collection(db, "sunnahs"), {
                    author: document.getElementById('authorInput').value,
                    text: document.getElementById('textInput').value,
                    themeName: selectedTheme, // حفظ اسم الستايل بدل اللون المباشر
                    likedBy: [], 
                    ownerId: deviceId, 
                    timestamp: Date.now()
                });
                closeModal('addModal');
                document.getElementById('postForm').reset();
            } catch (error) {
                alert("حدث خطأ في الاتصال.");
            }
            btn.innerText = "نشر السُنة"; btn.disabled = false;
        });

        // حل مشكلة الإعجابات (التحديث المباشر من المصفوفة)
        window.toggleLike = async (id) => {
            const post = window.allPosts.find(p => p.id === id);
            if (!post) return;

            const postRef = doc(db, "sunnahs", id);
            const hasLiked = post.likedBy && post.likedBy.includes(deviceId);
            
            if (hasLiked) {
                await updateDoc(postRef, { likedBy: arrayRemove(deviceId) });
            } else {
                await updateDoc(postRef, { likedBy: arrayUnion(deviceId) });
            }
        };

        window.deletePost = async (id) => {
            if (confirm("هل أنت متأكد من حذف هذه السُنة نهائياً؟")) {
                await deleteDoc(doc(db, "sunnahs", id));
            }
        };

        window.sharePost = (text, author) => {
            if (navigator.share) navigator.share({ title: 'سُنة مهجورة', text: `${text} \n- ${author} \nتَذَكَّر`});
            else alert('تم النسخ!');
        };

        // حل مشكلة حفظ الصورة (إنشاء نسخة صلبة مخفية في الخلفية للتصوير)
        window.saveAsImage = async (btn, author) => {
            const originalCard = btn.closest('.post-card');
            
            // إنشاء بطاقة وهمية للتصوير لضمان عدم وجود شفافية تفسد الصورة
            const clone = originalCard.cloneNode(true);
            clone.querySelector('.card-actions').remove(); // إزالة الأزرار
            
            // إضافة التوقيع
            const watermark = document.createElement('div');
            watermark.innerHTML = '<div style="text-align:center; margin-top:15px; padding-top:15px; border-top:1px dashed #073B2F; font-size:1rem; font-weight:900; color:#073B2F; opacity:0.8;">نُشر عبر منصة تَذَكَّر 🌿</div>';
            clone.appendChild(watermark);

            // فرض ألوان صلبة ثابتة للصورة بناءً على الستايل
            clone.style.position = 'absolute';
            clone.style.left = '-9999px'; // إخفاء البطاقة الوهمية
            clone.style.width = '400px';
            clone.style.borderRadius = '0'; // لجعل الصورة مربعة/مستطيلة مثالية
            clone.style.color = '#073B2F'; // لون النص دائماً داكن في الصورة
            
            if(clone.classList.contains('theme-blush')) clone.style.background = '#FEE8FF';
            else if(clone.classList.contains('theme-glass')) clone.style.background = '#FFFFFF';
            else clone.style.background = '#F5FFEA';

            document.body.appendChild(clone);

            try {
                const canvas = await html2canvas(clone, { scale: 3, useCORS: true });
                const link = document.createElement('a');
                link.download = `sunnah_${author}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                alert('حدث خطأ أثناء حفظ الصورة.');
            } finally {
                clone.remove(); // تنظيف الصفحة
            }
        };

        function renderPosts(posts) {
            const container = document.getElementById('postsContainer');
            container.innerHTML = posts.length === 0 ? '<p style="text-align:center; margin-top:50px; opacity:0.6;">لا توجد مشاركات بعد..</p>' : '';
            
            posts.forEach(post => {
                const themeClass = post.themeName || 'theme-sage'; // توافق مع المنشورات القديمة
                const card = document.createElement('div');
                card.className = `post-card glass-panel ${themeClass}`;

                const likesArray = post.likedBy || [];
                const likeCount = likesArray.length;
                const hasLiked = likesArray.includes(deviceId);
                const isOwner = post.ownerId === deviceId; 

                const safeText = post.text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const safeAuthor = post.author.replace(/'/g, "\\'").replace(/"/g, '&quot;');

                card.innerHTML = `
                    <div class="card-text">${post.text}</div>
                    <div class="card-signature">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        ${post.author}
                    </div>
                    <div class="card-actions">
                        <div style="display: flex; gap: 12px;">
                            <button class="action-btn ${hasLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}')" title="إعجاب">
                                <svg viewBox="0 0 24 24" fill="${hasLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                                ${likeCount}
                            </button>
                            <button class="action-btn" onclick="saveAsImage(this, '${safeAuthor}')" title="حفظ كصورة">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            </button>
                            <button class="action-btn" onclick="sharePost('${safeText}', '${safeAuthor}')" title="مشاركة">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                            </button>
                        </div>
                        ${isOwner ? `
                        <button class="action-btn delete-btn" onclick="deletePost('${post.id}')" title="حذف المنشور">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                        ` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderLeaderboard(posts) {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '<h2 style="text-align:center; margin-bottom:25px; color:var(--burgundy);">المتصدرين</h2>';
            
            const sorted = [...posts].sort((a, b) => (b.likedBy?.length || 0) - (a.likedBy?.length || 0)).slice(0, 10);
            
            sorted.forEach((post, index) => {
                const div = document.createElement('div');
                div.className = 'glass-panel';
                div.style = 'padding:15px 20px; border-radius:16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; background: rgba(255,255,255,0.1);';
                
                const likeCount = post.likedBy?.length || 0;
                
                div.innerHTML = `
                    <div>
                        <strong style="font-size:1.1rem; color:var(--text-main);">#${index+1} ${post.author}</strong> 
                        <span style="font-size:0.9rem; opacity:0.7; display:block; margin-top:5px; color:var(--text-main);">${post.text.substring(0,40)}...</span>
                    </div> 
                    <div style="color:var(--burgundy); font-weight:900; font-size:1.2rem; display:flex; align-items:center; gap:5px;">
                        <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> 
                        ${likeCount}
                    </div>
                `;
                container.appendChild(div);
            });
        }
    </script>
