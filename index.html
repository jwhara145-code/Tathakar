<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سنن مهجورة | إحياء الأثر</title>
    <!-- استدعاء خط عربي أنيق (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --cherry: #560D07;
            --crimson: #8B0F05;
            --bounty: #7B9CBD;
            --ivory: #FDF7EB;
            --glass-bg: rgba(86, 13, 7, 0.35);
            --glass-card: rgba(253, 247, 235, 0.05);
            --border-glow: rgba(123, 156, 189, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--cherry);
            color: var(--ivory);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(139, 15, 5, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(123, 156, 189, 0.15) 0%, transparent 40%);
            padding-bottom: 50px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glow);
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--ivory);
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        header p {
            color: var(--bounty);
            font-size: 1.1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* لوحة التحكم والتبويب */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background: var(--glass-card);
            border: 1px solid var(--border-glow);
            color: var(--ivory);
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--crimson);
            border-color: var(--bounty);
            box-shadow: 0 0 15px rgba(139, 15, 5, 0.5);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* نموذج النشر */
        .card-glass {
            background: rgba(253, 247, 235, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--bounty);
            font-weight: 600;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(253, 247, 235, 0.07);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            color: var(--ivory);
            font-size: 1rem;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--bounty);
            box-shadow: 0 0 10px rgba(123, 156, 189, 0.3);
        }

        .color-picker-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .color-option {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }

        .color-option.selected {
            border-color: var(--ivory);
            transform: scale(1.15);
            box-shadow: 0 0 10px var(--ivory);
        }

        .symbols-group {
            display: flex;
            gap: 10px;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .symbol-option {
            padding: 5px 10px;
            background: rgba(253, 247, 235, 0.05);
            border-radius: 8px;
            border: 1px solid transparent;
            transition: 0.2s;
        }

        .symbol-option.selected {
            background: var(--crimson);
            border-color: var(--bounty);
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--crimson), var(--cherry));
            color: var(--ivory);
            border: 1px solid var(--bounty);
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .submit-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 20px rgba(139, 15, 5, 0.8);
        }

        /* شبكة المنشورات */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .post-card {
            border-radius: 16px;
            padding: 20px;
            position: relative;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(253, 247, 235, 0.15);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .post-card:hover {
            transform: translateY(-5px);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.9rem;
            opacity: 0.85;
        }

        .post-symbol {
            font-size: 1.6rem;
        }

        .post-content {
            font-size: 1.055rem;
            line-height: 1.6;
            margin-bottom: 15px;
            word-break: break-word;
        }

        .post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(253, 247, 235, 0.1);
            padding-top: 10px;
        }

        .like-btn {
            background: none;
            border: none;
            color: var(--ivory);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 1rem;
            transition: 0.2s;
        }

        .like-btn:hover {
            color: #ff6b6b;
            transform: scale(1.1);
        }

        /* لوحة الصدارة */
        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(253, 247, 235, 0.04);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-glow);
        }

        .rank {
            font-weight: 900;
            color: var(--bounty);
            font-size: 1.2rem;
            margin-left: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>سُنَن مُهجورة ✨</h1>
        <p>أحيِ سُنةً نبيّك.. واجعل أثرها يمتد في حياتنا ومجتمعنا المدرسي</p>
    </header>

    <div class="container">
        <!-- أزرار التنقل بين الأقسام -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('feed')">المنشورات الحية 🌐</button>
            <button class="tab-btn" onclick="switchTab('add')">انشر سُنة ✍️</button>
            <button class="tab-btn" onclick="switchTab('leaderboard')">لوحة الصدارة 🏆</button>
        </div>

        <!-- قسم المنشورات الحية -->
        <div id="feed-section" class="section active">
            <div id="postsContainer" class="posts-grid">
                <!-- ستتم تعبئة المنشورات ديناميكياً -->
            </div>
        </div>

        <!-- قسم إضافة منشور جديد -->
        <div id="add-section" class="section">
            <div class="card-glass">
                <form id="sunnahForm" onsubmit="addPost(event)">
                    <div class="form-group">
                        <label for="authorName">اسمك أو اللقب:</label>
                        <input type="text" id="authorName" placeholder="مثال: فاعلة خير / طالبة منسقة" required>
                    </div>

                    <div class="form-group">
                        <label for="postText">نص السنة المهجورة وطريقة تطبيقها:</label>
                        <textarea id="postText" rows="4" placeholder="اكتبي السنة هنا باختصار وجمال..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label>اختر لون بطاقة المنشور:</label>
                        <div class="color-picker-group">
                            <div class="color-option selected" style="background-color: #560D07;" onclick="selectColor('#560D07', this)" data-color="#560D07"></div>
                            <div class="color-option" style="background-color: #8B0F05;" onclick="selectColor('#8B0F05', this)" data-color="#8B0F05"></div>
                            <div class="color-option" style="background-color: #7B9CBD;" onclick="selectColor('#7B9CBD', this)" data-color="#7B9CBD"></div>
                            <div class="color-option" style="background-color: #31445b;" onclick="selectColor('#31445b', this)" data-color="#31445b"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>اختر رمزاً جمالياً يزين منشورك:</label>
                        <div class="symbols-group">
                            <span class="symbol-option selected" onclick="selectSymbol('🌸', this)">🌸</span>
                            <span class="symbol-option" onclick="selectSymbol('🌿', this)">🌿</span>
                            <span class="symbol-option" onclick="selectSymbol('✨', this)">✨</span>
                            <span class="symbol-option" onclick="selectSymbol('🤍', this)">🤍</span>
                            <span class="symbol-option" onclick="selectSymbol('☕', this)">☕</span>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">انشر الأجر الآن 🚀</button>
                </form>
            </div>
        </div>

        <!-- قسم لوحة الصدارة -->
        <div id="leaderboard-section" class="section">
            <div class="card-glass">
                <h3 style="margin-bottom: 20px; color: var(--bounty);">🏆 المنشورات الأكثر تفاعلاً وإعجاباً</h3>
                <div id="leaderboardContainer" class="leaderboard-list">
                    <!-- ستتم تعبئة الصدارة ديناميكياً -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // إعدادات الحالة والبيانات الأولية
        let selectedColor = '#560D07';
        let selectedSymbol = '🌸';

        // بيانات تجريبية أولية لإثراء الموقع عند فتحه لأول مرة
        let posts = JSON.parse(localStorage.getItem('sunnah_posts')) || [
            {
                id: 1,
                name: 'سارة العتيبي',
                text: 'سنة المضمضة والاستنشاق من كف واحدة (الجمع بينهما بماء واحد لتوفير الماء والاقتداء الكامل).',
                color: '#8B0F05',
                symbol: '🌿',
                likes: 14
            },
            {
                id: 2,
                name: 'رهف القحطاني',
                text: 'نفض الفراش ثلاث مرات قبل النوم وقول الدعاء الوارد.',
                color: '#560D07',
                symbol: '✨',
                likes: 22
            },
            {
                id: 3,
                name: 'نورة الدوسري',
                text: 'إفشاء السلام على من عرفت ومن لم تعرف لتأليف القلوب.',
                color: '#7B9CBD',
                symbol: '🤍',
                likes: 19
            }
        ];

        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            if (tabId === 'feed') {
                document.getElementById('feed-section').classList.add('active');
                event.target.classList.add('active');
                renderPosts();
            } else if (tabId === 'add') {
                document.getElementById('add-section').classList.add('active');
                event.target.classList.add('active');
            } else if (tabId === 'leaderboard') {
                document.getElementById('leaderboard-section').classList.add('active');
                event.target.classList.add('active');
                renderLeaderboard();
            }
        }

        function selectColor(color, element) {
            selectedColor = color;
            document.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
        }

        function selectSymbol(symbol, element) {
            selectedSymbol = symbol;
            document.querySelectorAll('.symbol-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
        }

        function addPost(e) {
            e.preventDefault();
            const name = document.getElementById('authorName').value;
            const text = document.getElementById('postText').value;

            const newPost = {
                id: Date.now(),
                name: name,
                text: text,
                color: selectedColor,
                symbol: selectedSymbol,
                likes: 0
            };

            posts.unshift(newPost);
            saveAndRefresh();
            
            // إعادة تعيين النموذج والذهاب تلقائياً للمنشورات
            document.getElementById('sunnahForm').reset();
            switchTabDirect('feed');
        }

        function switchTabDirect(tabId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(tabId === 'feed') {
                document.getElementById('feed-section').classList.add('active');
                document.querySelector('.tab-btn').classList.add('active');
                renderPosts();
            }
        }

        function likePost(id) {
            const post = posts.find(p => p.id === id);
            if (post) {
                post.likes += 1;
                saveAndRefresh();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('sunnah_posts', JSON.stringify(posts));
            renderPosts();
            renderLeaderboard();
        }

        function renderPosts() {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '';

            if (posts.length === 0) {
                container.innerHTML = '<p style="text-align:center; color: var(--bounty); grid-column: 1/-1;">لا توجد منشورات بعد.. كوني أول من ينشر سُنة! ✨</p>';
                return;
            }

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.style.backgroundColor = post.color;
                card.innerHTML = `
                    <div class="post-header">
                        <span>${post.name}</span>
                        <span class="post-symbol">${post.symbol}</span>
                    </div>
                    <div class="post-content">${post.text}</div>
                    <div class="post-footer">
                        <button class="like-btn" onclick="likePost(${post.id})">
                            ❤️ <span>${post.likes}</span> إعجاب
                        </button>
                        <span style="font-size: 0.8rem; opacity: 0.7;">سُنة مهجورة</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderLeaderboard() {
            const container = document.getElementById('leaderboardContainer');
            container.innerHTML = '';

            // ترتيب المنشورات تنازلياً حسب عدد الإعجابات (دوري/مستمر)
            const sortedPosts = [...posts].sort((a, b) => b.likes - a.likes);

            sortedPosts.forEach((post, index) => {
                const item = document.createElement('div');
                item.className = 'leaderboard-item';
                item.innerHTML = `
                    <div style="display: flex; align-items: center;">
                        <span class="rank">#${index + 1}</span>
                        <div>
                            <div style="font-weight: 700; margin-bottom: 4px;">${post.text.substring(0, 45)}...</div>
                            <div style="font-size: 0.85rem; color: var(--bounty);">بواسطة: ${post.name} ${post.symbol}</div>
                        </div>
                    </div>
                    <div style="font-weight: 900; color: #ff6b6b; font-size: 1.1rem;">
                        ❤️ ${post.likes}
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // تشغيل العرض عند تحميل الصفحة أول مرة
        renderPosts();
    </script>
</body>
</html>
