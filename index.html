<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تَذَكَّر | Tathakkar</title>
    <!-- استدعاء خطوط عصرية وروحانية -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* المتغيرات الأساسية وأنماط الألوان */
        :root {
            /* النمط الفاتح (الافتراضي) */
            --bg-color: #FDF7EB;
            --text-main: #333333;
            --text-muted: #666666;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --header-bg: rgba(253, 247, 235, 0.85);
            --input-bg: rgba(255, 255, 255, 0.9);
            --particle-color: rgba(139, 15, 5, 0.1);
        }

        [data-theme="dark"] {
            /* النمط الليلي */
            --bg-color: #121212;
            --text-main: #FDF7EB;
            --text-muted: #AAAAAA;
            --glass-bg: rgba(30, 30, 30, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --header-bg: rgba(18, 18, 18, 0.85);
            --input-bg: rgba(0, 0, 0, 0.5);
            --particle-color: rgba(253, 247, 235, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* لمنع التمرير العام، التمرير سيكون للمنشورات فقط */
            position: relative;
        }

        /* العناصر المتحركة في الخلفية */
        #particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--particle-color);
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
        }

        /* الشاشة الافتتاحية التفاعلية */
        #splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            background: linear-gradient(135deg, #560D07, #8B0F05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            overflow: hidden;
        }

        #splash h1 {
            font-size: 4rem;
            color: #FDF7EB;
            font-weight: 900;
            z-index: 2;
            animation: pulse 2s infinite alternate;
        }

        #splash p {
            color: #FDF7EB;
            opacity: 0.8;
            font-size: 1.2rem;
            margin-top: 10px;
            z-index: 2;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            transform: scale(0);
            animation: rippleEffect 1s linear forwards;
            pointer-events: none;
        }

        @keyframes rippleEffect {
            to { transform: scale(15); opacity: 0; }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* الشريط العلوي */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: var(--header-bg);
            backdrop-filter: blur(15px);
            z-index: 10;
            border-bottom: 1px solid var(--glass-border);
        }

        header h1 {
            font-size: 2rem;
            font-weight: 900;
            margin: 0;
        }

        .controls button {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            margin-left: 5px;
            margin-right: 5px;
        }

        /* منطقة عرض المنشورات */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            z-index: 5;
            scroll-behavior: smooth;
            padding-bottom: 250px; /* لتجنب التغطية من قبل شريط الإضافة */
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            margin-top: 50px;
            font-size: 1.2rem;
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .post-card {
            border-radius: 20px;
            padding: 25px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.5s forwards ease-out;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        @keyframes slideUp {
            to { transform: translateY(0); opacity: 1; }
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .post-symbol { font-size: 2rem; }

        .post-content {
            font-family: 'Amiri', serif;
            font-size: 1.4rem;
            line-height: 1.6;
            margin-bottom: 20px;
            word-break: break-word;
        }

        .post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 15px;
        }

        .like-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            cursor: pointer;
            padding: 5px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1rem;
            transition: 0.2s;
        }

        .like-btn:hover { background: rgba(255,255,255,0.4); transform: scale(1.05); }

        /* شريط الإضافة السفلي (Fixed Footer Form) */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            padding: 15px 20px;
            z-index: 10;
            box-shadow: 0 -5px 30px rgba(0,0,0,0.1);
        }

        .add-form-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .inputs-row {
            display: flex;
            gap: 10px;
        }

        input, textarea {
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 12px;
            border-radius: 12px;
            outline: none;
        }
        
        input { flex: 1; }
        textarea { flex: 3; resize: none; font-family: 'Amiri', serif; font-size: 1.2rem;}

        .tools-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .scrollable-options {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            max-width: 40%;
        }
        .scrollable-options::-webkit-scrollbar { height: 4px; }
        .scrollable-options::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 4px; }

        .color-circle {
            min-width: 30px; height: 30px; border-radius: 50%;
            cursor: pointer; border: 2px solid transparent; transition: 0.2s;
        }
        .color-circle.active { border-color: var(--text-main); transform: scale(1.2); }

        .emoji-btn {
            min-width: 35px; text-align: center; font-size: 1.5rem;
            cursor: pointer; filter: grayscale(100%); transition: 0.2s;
        }
        .emoji-btn.active { filter: grayscale(0%); transform: scale(1.3); }

        .submit-btn {
            background: #8B0F05;
            color: #FDF7EB;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .submit-btn:hover { background: #560D07; transform: translateY(-2px); }

        /* استجابة الشاشات الصغيرة */
        @media (max-width: 768px) {
            .inputs-row { flex-direction: column; }
            .tools-row { flex-direction: column; align-items: stretch; }
            .scrollable-options { max-width: 100%; justify-content: center; }
            header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body data-theme="light">

    <!-- الخلفية المتحركة -->
    <div id="particles"></div>

    <!-- الشاشة الافتتاحية -->
    <div id="splash" onclick="dismissSplash(event)">
        <h1 data-i18n="splashTitle">تَذَكَّر</h1>
        <p data-i18n="splashSubtitle">اضغط للبدء واكتشاف الأثر ✨</p>
    </div>

    <!-- الشريط العلوي -->
    <header>
        <h1 data-i18n="title">تَذَكَّر 🤍</h1>
        <div class="controls">
            <button onclick="toggleTheme()" id="themeBtn">🌙</button>
            <button onclick="toggleLang()" id="langBtn">EN</button>
        </div>
    </header>

    <!-- منطقة عرض المنشورات -->
    <main id="mainContent">
        <div id="postsContainer" class="posts-grid">
            <!-- سيتم توليد المنشورات هنا -->
        </div>
    </main>

    <!-- شريط الإضافة السفلي -->
    <footer>
        <form class="add-form-container" onsubmit="addPost(event)">
            <div class="inputs-row">
                <input type="text" id="authorInput" data-i18n-placeholder="authorPlaceholder" placeholder="اسمك أو اللقب" required>
                <textarea id="textInput" rows="2" data-i18n-placeholder="sunnahPlaceholder" placeholder="اكتب السنة المهجورة هنا..." required></textarea>
            </div>
            
            <div class="tools-row">
                <!-- الألوان -->
                <div class="scrollable-options" id="colorPicker">
                    <div class="color-circle active" style="background: #8B0F05;" data-color="#8B0F05"></div>
                    <div class="color-circle" style="background: #F1C40F;" data-color="#E2B10B"></div> <!-- أصفر -->
                    <div class="color-circle" style="background: #27AE60;" data-color="#27AE60"></div> <!-- أخضر -->
                    <div class="color-circle" style="background: #E84393;" data-color="#E84393"></div> <!-- وردي -->
                    <div class="color-circle" style="background: #7F8C8D;" data-color="#7F8C8D"></div> <!-- رمادي -->
                    <div class="color-circle" style="background: #2980B9;" data-color="#2980B9"></div> <!-- أزرق -->
                </div>

                <!-- الإيموجي -->
                <div class="scrollable-options" id="emojiPicker">
                    <div class="emoji-btn active" data-emoji="🌸">🌸</div>
                    <div class="emoji-btn" data-emoji="🌿">🌿</div>
                    <div class="emoji-btn" data-emoji="✨">✨</div>
                    <div class="emoji-btn" data-emoji="🤍">🤍</div>
                    <div class="emoji-btn" data-emoji="🕌">🕌</div>
                    <div class="emoji-btn" data-emoji="📖">📖</div>
                    <div class="emoji-btn" data-emoji="💡">💡</div>
                    <div class="emoji-btn" data-emoji="🕊️">🕊️</div>
                </div>

                <button type="submit" class="submit-btn" data-i18n="publishBtn">انشر السُّنة 🚀</button>
            </div>
        </form>
    </footer>

    <script>
        // ---------------- قاموس الترجمة (Bilingual) ---------------- //
        const translations = {
            ar: {
                splashTitle: "تَذَكَّر",
                splashSubtitle: "اضغط للبدء واكتشاف الأثر ✨",
                title: "تَذَكَّر 🤍",
                authorPlaceholder: "اسمك أو اللقب",
                sunnahPlaceholder: "اكتب السنة المهجورة هنا...",
                publishBtn: "انشر السُّنة 🚀",
                emptyState: "لا توجد سنن منشورة بعد.. كن أول المبادرين! ✨",
                likes: "إعجاب"
            },
            en: {
                splashTitle: "Tathakkar",
                splashSubtitle: "Tap to begin and discover the impact ✨",
                title: "Tathakkar 🤍",
                authorPlaceholder: "Your Name or Alias",
                sunnahPlaceholder: "Write the forgotten Sunnah here...",
                publishBtn: "Publish Sunnah 🚀",
                emptyState: "No Sunnahs published yet.. Be the first! ✨",
                likes: "Likes"
            }
        };

        let currentLang = 'ar';
        let currentTheme = 'light';
        let selectedColor = '#8B0F05';
        let selectedEmoji = '🌸';

        // تحميل المنشورات من التخزين المحلي (فارغة في البداية)
        let posts = JSON.parse(localStorage.getItem('tathakkar_real_posts')) || [];

        // ---------------- إنشاء العناصر المتحركة في الخلفية ---------------- //
        function createParticles() {
            const container = document.getElementById('particles');
            for(let i = 0; i < 20; i++) {
                let p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.width = p.style.height = (Math.random() * 40 + 10) + 'px';
                p.style.animationDelay = (Math.random() * 15) + 's';
                container.appendChild(p);
            }
        }

        // ---------------- الشاشة الافتتاحية التفاعلية ---------------- //
        function dismissSplash(e) {
            const splash = document.getElementById('splash');
            
            // تأثير التموج (Ripple Effect)
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            splash.appendChild(ripple);

            // إخفاء الشاشة بعد الحركة
            setTimeout(() => {
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 500);
            }, 600);
        }

        // ---------------- تبديل اللغة (Arabic / English) ---------------- //
        function toggleLang() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'EN' : 'AR';
            
            updateTranslations();
            renderPosts(); // لتحديث كلمة "إعجاب/Likes" في المنشورات
        }

        function updateTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.innerText = translations[currentLang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                el.placeholder = translations[currentLang][key];
            });
        }

        // ---------------- تبديل النمط (Light / Dark) ---------------- //
        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', currentTheme);
            document.getElementById('themeBtn').innerText = currentTheme === 'light' ? '🌙' : '☀️';
        }

        // ---------------- إعداد اختيار الألوان والإيموجي ---------------- //
        document.querySelectorAll('.color-circle').forEach(circle => {
            circle.addEventListener('click', function() {
                document.querySelectorAll('.color-circle').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                selectedColor = this.getAttribute('data-color');
            });
        });

        document.querySelectorAll('.emoji-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedEmoji = this.getAttribute('data-emoji');
            });
        });

        // ---------------- إضافة منشور جديد ---------------- //
        function addPost(e) {
            e.preventDefault();
            const author = document.getElementById('authorInput').value.trim();
            const text = document.getElementById('textInput').value.trim();

            if(!author || !text) return;

            const newPost = {
                id: Date.now(),
                author: author,
                text: text,
                color: selectedColor,
                emoji: selectedEmoji,
                likes: 0
            };

            posts.unshift(newPost); // إضافة للأعلى
            saveData();
            renderPosts();
            
            // تفريغ الحقول
            document.getElementById('textInput').value = '';
            
            // التمرير للأعلى لرؤية المنشور الجديد
            document.getElementById('mainContent').scrollTo(0, 0);
        }

        function likePost(id) {
            const post = posts.find(p => p.id === id);
            if (post) {
                post.likes++;
                saveData();
                renderPosts();
            }
        }

        function saveData() {
            localStorage.setItem('tathakkar_real_posts', JSON.stringify(posts));
        }

        // ---------------- عرض المنشورات ---------------- //
        function renderPosts() {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '';

            if (posts.length === 0) {
                container.innerHTML = `<div class="empty-state">${translations[currentLang].emptyState}</div>`;
                return;
            }

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.style.background = post.color;
                
                card.innerHTML = `
                    <div class="post-header">
                        <span>${post.author}</span>
                        <span class="post-symbol">${post.emoji}</span>
                    </div>
                    <div class="post-content">${post.text}</div>
                    <div class="post-footer">
                        <button class="like-btn" onclick="likePost(${post.id})">
                            ❤️ ${post.likes} ${translations[currentLang].likes}
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ---------------- التهيئة الأولية (Init) ---------------- //
        window.onload = () => {
            createParticles();
            updateTranslations();
            renderPosts();
        };
    </script>
</body>
</html>
