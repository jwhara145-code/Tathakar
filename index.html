<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تَذَكَّر | Tathakkar</title>
    <!-- استدعاء الخطوط -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* المتغيرات الأساسية */
        :root {
            --bg-color: #FDF7EB;
            --text-main: #333333;
            --text-muted: #666666;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --header-bg: rgba(253, 247, 235, 0.85);
            --input-bg: rgba(255, 255, 255, 0.9);
            --particle-color: rgba(139, 15, 5, 0.1);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-main: #FDF7EB;
            --text-muted: #AAAAAA;
            --glass-bg: rgba(30, 30, 30, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --header-bg: rgba(18, 18, 18, 0.85);
            --input-bg: rgba(0, 0, 0, 0.5);
            --particle-color: rgba(253, 247, 235, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; transition: background-color 0.4s ease, color 0.4s ease; }

        body {
            background-color: var(--bg-color); color: var(--text-main);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative;
        }

        /* الخلفية المتحركة */
        #particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .particle { position: absolute; border-radius: 50%; background: var(--particle-color); animation: floatUp 15s infinite linear; }
        @keyframes floatUp { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(-20vh) scale(1.5); opacity: 0; } }

        /* الشاشة الافتتاحية */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: linear-gradient(135deg, #560D07, #8B0F05);
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            z-index: 9999; cursor: pointer; overflow: hidden; padding: 20px;
        }
        #splash h1 { font-size: clamp(3rem, 8vw, 5rem); color: #FDF7EB; font-weight: 900; z-index: 2; animation: pulse 2s infinite alternate; margin-bottom: 15px;}
        .quran-verse { font-family: 'Amiri', serif; color: #F1C40F; font-size: clamp(1.5rem, 4vw, 2.5rem); margin-bottom: 20px; z-index: 2; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        #splash p.subtitle { color: #FDF7EB; opacity: 0.8; font-size: 1.2rem; z-index: 2; }
        
        .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.4); transform: scale(0); animation: rippleEffect 1s linear forwards; pointer-events: none; }
        @keyframes rippleEffect { to { transform: scale(25); opacity: 0; } }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }

        /* الشريط العلوي */
        header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 5%;
            background: var(--header-bg); backdrop-filter: blur(15px); z-index: 10; border-bottom: 1px solid var(--glass-border);
        }
        header h1 { font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 900; margin: 0; }
        .controls button { background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-main); padding: 8px 12px; border-radius: 20px; cursor: pointer; font-weight: 700; margin: 0 5px; }

        /* منطقة المحتوى */
        main { flex: 1; overflow-y: auto; padding: 20px 5%; z-index: 5; scroll-behavior: smooth; padding-bottom: 280px; }
        .posts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        
        /* بطاقات السنن وحركتها اللطيفة */
        .post-card {
            border-radius: 20px; padding: 25px; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative; animation: slideUp 0.5s forwards ease-out, floatCard 6s infinite ease-in-out alternate;
            display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
        }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes floatCard { 0% { transform: translateY(0); } 100% { transform: translateY(-5px); } }

        .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: 700; }
        .post-symbol { font-size: 2rem; animation: gentleShake 3s infinite; }
        @keyframes gentleShake { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
        
        .post-content { font-family: 'Amiri', serif; font-size: clamp(1.2rem, 3vw, 1.4rem); line-height: 1.6; margin-bottom: 15px; word-break: break-word; }
        
        .post-media img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; border: 2px solid rgba(255,255,255,0.3); }
        .post-media audio { width: 100%; height: 40px; margin-bottom: 15px; border-radius: 20px; outline: none; }

        .post-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 15px; }
        .like-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; cursor: pointer; padding: 5px 15px; border-radius: 20px; font-weight: 700; transition: 0.2s; }
        .like-btn:hover { background: rgba(255,255,255,0.4); transform: scale(1.05); }

        /* شريط الإضافة السفلي (متجاوب) */
        footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--glass-bg); backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border); padding: 15px 5%; z-index: 10; box-shadow: 0 -5px 30px rgba(0,0,0,0.1);
        }
        .add-form-container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .inputs-row { display: flex; gap: 10px; flex-wrap: wrap; }
        input[type="text"], textarea { background: var(--input-bg); border: 1px solid var(--glass-border); color: var(--text-main); padding: 12px; border-radius: 12px; outline: none; font-size: 1rem; }
        input[type="text"] { flex: 1; min-width: 150px; }
        textarea { flex: 3; min-width: 250px; resize: none; font-family: 'Amiri', serif; font-size: 1.2rem; }
        
        .tools-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .options-group { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; flex: 1; align-items: center; }
        .options-group::-webkit-scrollbar { height: 4px; }
        .options-group::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 4px; }
        
        .color-circle { min-width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .color-circle.active { border-color: var(--text-main); transform: scale(1.2); }
        .emoji-btn { min-width: 35px; text-align: center; font-size: 1.5rem; cursor: pointer; filter: grayscale(100%); transition: 0.2s; }
        .emoji-btn.active { filter: grayscale(0%); transform: scale(1.3); }

        .media-uploads { display: flex; gap: 10px; }
        .media-btn { background: rgba(123, 156, 189, 0.2); padding: 8px 12px; border-radius: 12px; cursor: pointer; font-size: 0.9rem; font-weight: 700; transition: 0.3s; color: var(--text-main); border: 1px solid var(--glass-border); }
        .media-btn:hover { background: rgba(123, 156, 189, 0.4); }
        .media-status { font-size: 0.8rem; color: #27AE60; font-weight: bold; margin-top: 5px;}

        .submit-btn { background: #8B0F05; color: #FDF7EB; border: none; padding: 12px 25px; border-radius: 12px; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: 0.3s; white-space: nowrap; }
        .submit-btn:hover { background: #560D07; transform: translateY(-2px); }

        @media (max-width: 600px) {
            .tools-row { flex-direction: column; align-items: stretch; }
            .media-uploads { justify-content: center; }
            .submit-btn { width: 100%; }
        }
    </style>
</head>
<body data-theme="light">

    <!-- الخلفية المتحركة -->
    <div id="particles"></div>

    <!-- الشاشة الافتتاحية التفاعلية -->
    <div id="splash" onclick="dismissSplash(event)">
        <h1 data-i18n="splashTitle">تَذَكَّر</h1>
        <!-- الآية الكريمة المضافة -->
        <p class="quran-verse">فَذَكِّرْ إِنَّ الذِّكْرَى تَنفَعُ الْمُؤْمِنِينَ</p>
        <p class="subtitle" data-i18n="splashSubtitle">اضغط للبدء واكتشاف الأثر ✨</p>
    </div>

    <!-- الشريط العلوي -->
    <header>
        <h1 data-i18n="title">تَذَكَّر 🤍</h1>
        <div class="controls">
            <button onclick="toggleTheme()" id="themeBtn">🌙</button>
            <button onclick="toggleLang()" id="langBtn">EN</button>
        </div>
    </header>

    <!-- منطقة عرض المنشورات -->
    <main id="mainContent">
        <div id="postsContainer" class="posts-grid"></div>
    </main>

    <!-- شريط الإضافة السفلي -->
    <footer>
        <form class="add-form-container" id="postForm" onsubmit="addPost(event)">
            <div class="inputs-row">
                <input type="text" id="authorInput" data-i18n-placeholder="authorPlaceholder" placeholder="اسمك أو اللقب" required>
                <textarea id="textInput" rows="2" data-i18n-placeholder="sunnahPlaceholder" placeholder="اكتب السنة المهجورة هنا..." required></textarea>
            </div>
            
            <div class="tools-row">
                <div class="options-group" id="colorPicker">
                    <div class="color-circle active" style="background: #8B0F05;" data-color="#8B0F05"></div>
                    <div class="color-circle" style="background: #F1C40F;" data-color="#D4AC0D"></div>
                    <div class="color-circle" style="background: #27AE60;" data-color="#229954"></div>
                    <div class="color-circle" style="background: #E84393;" data-color="#D81B60"></div>
                    <div class="color-circle" style="background: #7F8C8D;" data-color="#616A6B"></div>
                    <div class="color-circle" style="background: #2980B9;" data-color="#2471A3"></div>
                </div>

                <div class="options-group" id="emojiPicker">
                    <div class="emoji-btn active" data-emoji="🌸">🌸</div>
                    <div class="emoji-btn" data-emoji="🌿">🌿</div>
                    <div class="emoji-btn" data-emoji="✨">✨</div>
                    <div class="emoji-btn" data-emoji="🤍">🤍</div>
                    <div class="emoji-btn" data-emoji="🕌">🕌</div>
                    <div class="emoji-btn" data-emoji="📖">📖</div>
                    <div class="emoji-btn" data-emoji="💡">💡</div>
                    <div class="emoji-btn" data-emoji="🕊️">🕊️</div>
                </div>
            </div>

            <div class="tools-row" style="margin-top: 5px;">
                <div class="media-uploads">
                    <label for="imageUpload" class="media-btn" id="imgLbl">📷 إضافة صورة</label>
                    <input type="file" id="imageUpload" accept="image/*" hidden onchange="handleFile('image')">
                    
                    <label for="audioUpload" class="media-btn" id="audioLbl">🎤 مقطع صوتي</label>
                    <input type="file" id="audioUpload" accept="audio/*" hidden onchange="handleFile('audio')">
                </div>
                <div id="mediaStatus" class="media-status"></div>
                <button type="submit" class="submit-btn" data-i18n="publishBtn">انشر السُّنة 🚀</button>
            </div>
        </form>
    </footer>

    <script>
        const translations = {
            ar: {
                splashTitle: "تَذَكَّر", splashSubtitle: "اضغط للبدء واكتشاف الأثر ✨", title: "تَذَكَّر 🤍",
                authorPlaceholder: "اسمك أو اللقب", sunnahPlaceholder: "اكتب السنة المهجورة هنا...",
                publishBtn: "انشر السُّنة 🚀", likes: "إعجاب", imgBtn: "📷 إضافة صورة", audioBtn: "🎤 مقطع صوتي"
            },
            en: {
                splashTitle: "Tathakkar", splashSubtitle: "Tap to begin and discover the impact ✨", title: "Tathakkar 🤍",
                authorPlaceholder: "Your Name or Alias", sunnahPlaceholder: "Write the forgotten Sunnah here...",
                publishBtn: "Publish Sunnah 🚀", likes: "Likes", imgBtn: "📷 Add Image", audioBtn: "🎤 Add Audio"
            }
        };

        let currentLang = 'ar', currentTheme = 'light';
        let selectedColor = '#8B0F05', selectedEmoji = '🌸';
        let attachedImage = null, attachedAudio = null;
        let posts = JSON.parse(localStorage.getItem('tathakkar_posts_v2')) || [];

        // خلفية متحركة
        function createParticles() {
            const container = document.getElementById('particles');
            for(let i = 0; i < 20; i++) {
                let p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.width = p.style.height = (Math.random() * 40 + 10) + 'px';
                p.style.animationDelay = (Math.random() * 15) + 's';
                container.appendChild(p);
            }
        }

        // تأثير الشاشة الافتتاحية
        function dismissSplash(e) {
            const splash = document.getElementById('splash');
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = e.clientX + 'px'; ripple.style.top = e.clientY + 'px';
            splash.appendChild(ripple);
            setTimeout(() => { splash.style.opacity = '0'; setTimeout(() => splash.style.display = 'none', 500); }, 600);
        }

        // تبديل اللغة
        function toggleLang() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'EN' : 'AR';
            updateTranslations(); renderPosts();
        }

        function updateTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = translations[currentLang][el.getAttribute('data-i18n')]);
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => el.placeholder = translations[currentLang][el.getAttribute('data-i18n-placeholder')]);
            document.getElementById('imgLbl').innerText = translations[currentLang].imgBtn;
            document.getElementById('audioLbl').innerText = translations[currentLang].audioBtn;
        }

        // تبديل النمط
        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', currentTheme);
            document.getElementById('themeBtn').innerText = currentTheme === 'light' ? '🌙' : '☀️';
        }

        // تفاعلات الألوان والإيموجي
        document.querySelectorAll('.color-circle').forEach(circle => {
            circle.addEventListener('click', function() {
                document.querySelectorAll('.color-circle').forEach(c => c.classList.remove('active'));
                this.classList.add('active'); selectedColor = this.getAttribute('data-color');
            });
        });

        document.querySelectorAll('.emoji-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active'); selectedEmoji = this.getAttribute('data-emoji');
            });
        });

        // معالجة الملفات (صورة / صوت)
        function handleFile(type) {
            const fileInput = type === 'image' ? document.getElementById('imageUpload') : document.getElementById('audioUpload');
            const file = fileInput.files[0];
            if (!file) return;
            
            // التحقق من الحجم (الحد الأقصى 2 ميجا تقريباً لتجنب امتلاء المتصفح)
            if (file.size > 2.5 * 1024 * 1024) {
                alert(currentLang === 'ar' ? "حجم الملف كبير جداً! الرجاء اختيار ملف أصغر." : "File is too large!");
                fileInput.value = ''; return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                if (type === 'image') { attachedImage = e.target.result; attachedAudio = null; }
                else { attachedAudio = e.target.result; attachedImage = null; }
                document.getElementById('mediaStatus').innerText = currentLang === 'ar' ? '✅ تم الإرفاق بنجاح' : '✅ Attached successfully';
            };
            reader.readAsDataURL(file);
        }

        // النشر
        function addPost(e) {
            e.preventDefault();
            const author = document.getElementById('authorInput').value.trim();
            const text = document.getElementById('textInput').value.trim();
            if(!author || !text) return;

            const newPost = { id: Date.now(), author, text, color: selectedColor, emoji: selectedEmoji, image: attachedImage, audio: attachedAudio, likes: 0 };
            posts.unshift(newPost);
            localStorage.setItem('tathakkar_posts_v2', JSON.stringify(posts));
            
            // تصفير الحقول
            document.getElementById('postForm').reset();
            attachedImage = null; attachedAudio = null;
            document.getElementById('mediaStatus').innerText = '';
            
            renderPosts();
            document.getElementById('mainContent').scrollTo(0, 0);
        }

        function likePost(id) {
            const post = posts.find(p => p.id === id);
            if (post) { post.likes++; localStorage.setItem('tathakkar_posts_v2', JSON.stringify(posts)); renderPosts(); }
        }

        function renderPosts() {
            const container = document.getElementById('postsContainer');
            container.innerHTML = posts.length === 0 ? `<p style="text-align:center; color:var(--text-muted); grid-column:1/-1; padding-top:50px;">${currentLang==='ar'?'لا توجد سنن منشورة بعد.. كن أول المبادرين! ✨':'No Sunnahs published yet.. Be the first! ✨'}</p>` : '';
            
            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card'; card.style.background = post.color;
                
                let mediaHTML = '';
                if(post.image) mediaHTML = `<div class="post-media"><img src="${post.image}" alt="Attached Image"></div>`;
                if(post.audio) mediaHTML = `<div class="post-media"><audio controls src="${post.audio}"></audio></div>`;

                card.innerHTML = `
                    <div class="post-header"><span>${post.author}</span><span class="post-symbol">${post.emoji}</span></div>
                    <div class="post-content">${post.text}</div>
                    ${mediaHTML}
                    <div class="post-footer">
                        <button class="like-btn" onclick="likePost(${post.id})">❤️ ${post.likes} ${translations[currentLang].likes}</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = () => { createParticles(); updateTranslations(); renderPosts(); };
    </script>
</body>
</html>
